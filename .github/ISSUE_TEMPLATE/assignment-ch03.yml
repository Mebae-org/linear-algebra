# MAGI
name: 課題03 線形変換の提出
description: 第3章の数値解答をGitHub Actionsで自動採点します
title: "[課題03] 線形変換"
labels: ["assignment", "ch03"]
body:
  - type: markdown
    attributes:
      value: |
        各問の解答は、単位・式・途中式を含めず、半角の整数1つだけを入力してください。提出後、GitHub Actionsが20点満点で自動採点します。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: "$A=\\begin{pmatrix}2&-1\\\\1&3\\end{pmatrix}$ で表される線形変換による点 $(3,2)$ の像の第1成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: "$T(1,0)=(1,2)$、$T(0,1)=(-3,4)$ のとき、$T$ の表現行列の第1行第2列成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: "$A=\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ の変換後に $B=\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$ の変換を行う。合成変換の行列の第2行第2列成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: "点 $(5,-2)$ を直線 $y=x$ に関して対称移動した像の第1成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: "点 $(3,-4)$ を原点中心に反時計回りに $90$ 度回転した像の第2成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
# /MAGI
