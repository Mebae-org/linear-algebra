# MAGI
name: 課題04 固有値と固有ベクトルの提出
description: 第4章の数値解答をGitHub Actionsで自動採点します
title: "[課題04] 固有値と固有ベクトル"
labels: ["assignment", "ch04"]
body:
  - type: markdown
    attributes:
      value: |
        各問の解答は、単位・式・途中式を含めず、半角の整数1つだけを入力してください。提出後、GitHub Actionsが20点満点で自動採点します。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: "$A=\\begin{pmatrix}4&1\\\\2&3\\end{pmatrix}$ の大きい方の固有値を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: "問1の行列の小さい方の固有値に属する固有ベクトルを $(1,y)^T$ とするとき、$y$ を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: "$B=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ の固有値の和を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: "$C=\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$ の固有値 $1$ に対する固有空間の次元を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: "$B=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ の $B^3$ の第1行第2列成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
# /MAGI
