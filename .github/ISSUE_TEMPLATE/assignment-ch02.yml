# MAGI
name: 課題02 行列と連立一次方程式の提出
description: 第2章の数値解答をGitHub Actionsで自動採点します
title: "[課題02] 行列と連立一次方程式"
labels: ["assignment", "ch02"]
body:
  - type: markdown
    attributes:
      value: |
        各問の解答は、単位・式・途中式を含めず、半角の整数1つだけを入力してください。提出後、GitHub Actionsが20点満点で自動採点します。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: "$A=\\begin{pmatrix}1&2\\\\-1&3\\end{pmatrix}$、$B=\\begin{pmatrix}2&-1\\\\4&0\\end{pmatrix}$ のとき、積 $AB$ の第1行第2列成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: "$A=\\begin{pmatrix}1&2\\\\-1&3\\end{pmatrix}$ の行列式を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: "$C=\\begin{pmatrix}2&1\\\\1&1\\end{pmatrix}$ の逆行列の第1行第2列成分を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: "連立方程式 $2x+y=7$、$x-y=2$ の $x$ を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: "$\\det D=-4$ とする。$D$ の第1行と第2行を交換し、その後第3行を3倍して得られる行列の行列式を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
# /MAGI
